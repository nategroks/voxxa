name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Q7 security review: the jobs only read the repository.
permissions:
  contents: read

# whisper.cpp builds with GGML_NATIVE (-march=native) by default, so the
# cached whisper-rs-sys build only runs on CPUs like the runner that built it.
# A main run crashed with STATUS_ILLEGAL_INSTRUCTION in model_download after
# rust-cache restored a build from another runner. whisper-rs-sys 0.11 passes
# only WHISPER_* and CMAKE_* variables to CMake, and WHISPER_NATIVE=OFF is
# ignored, so src-tauri/cmake/ggml-portable.cmake sets GGML_NATIVE off: the
# portable AVX/AVX2/FMA/F16C build. The cache key names it.
env:
  CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/src-tauri/cmake/ggml-portable.cmake

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is pinned, not ubuntu-latest: Ubuntu 24.04's AppArmor
        # default refuses unprivileged `unshare -rn`. VOXXA_REQUIRE_NETNS=1
        # (cargo test below) makes replay_no_sockets fail there instead of
        # falling back to strace with networking enabled (Q7 security review
        # section 4.1). Its "traced with" line shows only with --nocapture.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned (R13): a new stable clippy or rustfmt must not turn CI red on its own.
      # Bump deliberately, in its own PR, alongside any lint fixes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: portable-ggml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            strace

      # tauri::generate_context! embeds ../dist, so the frontend must exist before cargo runs.
      - name: Build frontend
        run: npm ci && npm run build

      # Q8 / ADR-017: Simple mode's status-light table and test verdict are
      # pure functions (src/simple/logic.js); node:test, no dependency.
      - name: GUI logic tests
        run: npm run test:gui

      # Q8 / ADR-017: the built GUI in headless Edge with a mocked backend
      # (tests/gui/mock-tauri.js, never shipped): Simple mode, the first-run
      # flow, the status light and every Advanced panel. Windows only, where
      # it was verified; it needs no audio device.
      - name: GUI in a browser with a mocked backend
        if: runner.os == 'Windows'
        run: npm run test:gui:e2e -- "${{ runner.temp }}/gui-e2e"

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      # Q7: voxxad and voxxa-eval need the off-by-default `cli` feature, so
      # the installers leave them out (Cargo.toml). Lint both ways: without
      # it (what `tauri build` compiles) and with it (the tools and the tests
      # that run them). bash on every OS so the && chain behaves the same.
      - name: cargo clippy
        working-directory: src-tauri
        shell: bash
        run: >-
          cargo clippy --all-targets -- -D warnings &&
          cargo clippy --all-targets --features cli -- -D warnings

      # Q7: tests/replay_no_sockets.rs traces `voxxad --replay` with strace
      # (Linux, inside `unshare -rn`) or ETW (Windows). VOXXA_REQUIRE_SOCKET_TRACE
      # makes a missing tracer fail instead of skip; VOXXA_REQUIRE_NETNS makes
      # a missing `unshare -rn` fail on Linux. macOS has no tracer without
      # disabling SIP, so the test skips there and says so.
      # tests/replay_determinism.rs replays every fixture log twice on each OS.
      - name: cargo test
        working-directory: src-tauri
        env:
          VOXXA_REQUIRE_SOCKET_TRACE: ${{ runner.os != 'macOS' && '1' || '' }}
          VOXXA_REQUIRE_NETNS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --features cli

      # Q5 / ADR-015: replay the committed fixture logs (no model, no audio)
      # and fail when a metric is worse than fixtures/baseline.json.
      # It scores every folder in fixtures/recordings: since Q6 the two
      # spoken stand-ins plus three synthetic TTS fixtures (refrain, jumps,
      # a prayer between songs). cargo test above already enforces the same gate
      # (replay_of_the_committed_fixtures_passes_the_baseline); this step
      # stays so the eval table appears in the CI log. bash on every OS so
      # the && chain behaves the same everywhere.
      - name: voxxa-eval (fixtures vs baseline)
        working-directory: src-tauri
        shell: bash
        run: cargo build --features cli --bin voxxad --bin voxxa-eval && cargo run --features cli --bin voxxa-eval

  deny:
    name: cargo deny (licences, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses advisories bans

  budgets:
    name: line budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei@15.0.0  # pinned (R13): scripts/loc_budget.py budgets depend on tokei's counting
      - run: python3 scripts/loc_budget.py
      # Q10 / ADR-020 § 6: the release helpers (latest.json, the winget manifest);
      # standard library only, no network.
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release -v

  # Q9V / ADR-019 § 8: the repository refuses media. The same check as
  # src-tauri/tests/media_guard.rs (which keeps this list in step), in its
  # own job, so a PR that adds media goes red even if that test is skipped.
  # git ls-files -z: without it git quotes a non-ASCII path and it slips past.
  # The path is lower-cased for matching (X.WAV); the allowlist is the 15
  # public-domain recordings by exact path (founder decision, 2026-11-20).
  media:
    name: media guard
    runs-on: ubuntu-latest  # needs only bash 4 or later; the check job's AppArmor reason for 22.04 does not apply
    steps:
      - uses: actions/checkout@v4
      - name: No media file and nothing under fixtures/private/ is tracked
        shell: bash
        run: |
          declare -A allowed
          for f in \
            src-tauri/tests/fixtures/voxxad/amazing-grace-v1.wav \
            src-tauri/tests/fixtures/voxxad/amazing-grace-v2.wav \
            src-tauri/tests/fixtures/voxxad/prayer.wav \
            src-tauri/tests/fixtures/voxxad/tts-be-thou-my-vision-v1-david.wav \
            src-tauri/tests/fixtures/voxxad/tts-be-thou-my-vision-v3-david.wav \
            src-tauri/tests/fixtures/voxxad/tts-be-thou-my-vision-v4-david.wav \
            src-tauri/tests/fixtures/voxxad/tts-come-thou-fount-v1-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-come-thou-fount-v2-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-holy-holy-holy-v1-david.wav \
            src-tauri/tests/fixtures/voxxad/tts-holy-holy-holy-v2-david.wav \
            src-tauri/tests/fixtures/voxxad/tts-it-is-well-refrain-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-it-is-well-v1-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-it-is-well-v2-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-it-is-well-v3-zira.wav \
            src-tauri/tests/fixtures/voxxad/tts-prayer-zira.wav
          do allowed[$f]=1; done
          bad=0
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            lower=${path,,}
            case "$lower" in
              fixtures/private/*|*/fixtures/private/*) ;;
              *.mp4|*.mov|*.m4v|*.mkv|*.webm|*.wav|*.flac|*.mp3|*.m4a)
                if [[ -n "${allowed[$path]:-}" ]]; then continue; fi ;;
              *) continue ;;
            esac
            echo "::error::tracked media or private fixture file (ADR-019 section 8): $path"
            bad=1
          done < <(git ls-files -z)
          if [ "$count" -lt 100 ]; then echo "::error::git ls-files listed only $count paths"; exit 1; fi
          if [ "$bad" -ne 0 ]; then echo "Untrack it with git rm --cached; never commit media."; exit 1; fi
          echo "media guard: $count tracked paths, no media outside the 15 allowed recordings"
