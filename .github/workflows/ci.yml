name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned (R13): a new stable clippy or rustfmt must not turn CI red on its own.
      # Bump deliberately, in its own PR, alongside any lint fixes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev

      # tauri::generate_context! embeds ../dist, so the frontend must exist before cargo runs.
      - name: Build frontend
        run: npm ci && npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Q5 / ADR-015: replay the committed fixture logs (no model, no audio)
      # and fail when a metric is worse than fixtures/baseline.json.
      # cargo test above already enforces the same gate
      # (replay_of_the_committed_fixtures_passes_the_baseline); this step
      # stays so the eval table appears in the CI log. bash on every OS so
      # the && chain behaves the same everywhere.
      - name: voxxa-eval (fixtures vs baseline)
        working-directory: src-tauri
        shell: bash
        run: cargo build --bin voxxad --bin voxxa-eval && cargo run --bin voxxa-eval

  deny:
    name: cargo deny (licences, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses advisories bans

  budgets:
    name: line budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei@15.0.0  # pinned (R13): scripts/loc_budget.py budgets depend on tokei's counting
      - run: python3 scripts/loc_budget.py
