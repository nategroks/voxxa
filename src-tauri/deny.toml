# cargo-deny configuration (ADR-005): GPL-compatible, commercially usable licences only.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unlicense",
  "BSD-2-Clause", "BSD-3-Clause", "MPL-2.0", "ISC", "Zlib", "0BSD", "BSL-1.0",
  "CC0-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "GPL-3.0-or-later",
]
# Anything not listed (AGPL, non-commercial, unknown) fails the check.

[licenses.private]
ignore = true

[advisories]
version = 2
yanked = "warn"
# Only direct dependencies count as "unmaintained": the unic-*, fxhash and proc-macro-error
# findings are transitive through tauri and have no upgrade; they are upstream's to fix.
unmaintained = "workspace"
# shortcut: zip 4.x comes only via tauri-plugin-updater, and no updater release depends on zip >= 9
# yet (checked 2.14.0 on 2026-10-25). Voxxa ships NSIS/MSI, .app.tar.gz and .AppImage.tar.gz updates,
# never .zip, and every archive is minisign-verified before extraction. Remove these ignores when
# tauri-plugin-updater moves to zip 9.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID bits on extract; see shortcut note above" },
  { id = "RUSTSEC-2026-0368", reason = "zip symlink escape on extract; see shortcut note above" },
  { id = "RUSTSEC-2026-0369", reason = "zip permissions through symlinks; see shortcut note above" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
