[package]
name = "voxxa"
version = "0.1.0"
description = "Voice-following slide advancer for church worship, running entirely on-device"
authors = ["nategroks"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voxxa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "voxxa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Audio capture
cpal = "0.15"

# Voice Activity Detection (energy-based, with future ONNX support)
# ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
# ndarray = "0.16"

# Whisper transcription
whisper-rs = "0.13"

# Model downloads
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
dirs = "6"

# Text insertion
enigo = "0.2"

[features]
default = []

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
