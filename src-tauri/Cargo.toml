[package]
name = "voxxa"
version = "0.1.0"
description = "Local-first voice dictation powered by Whisper"
authors = ["nategroks"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voxxa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "voxxa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Audio capture
cpal = "0.15"

# Voice Activity Detection — Silero VAD via ONNX Runtime.
# `voice_activity_detector` bundles the Silero model and handles ORT loading.
voice_activity_detector = "0.2"

# Whisper transcription
whisper-rs = "0.13"

# Model downloads
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
dirs = "6"

# Presenter control (keystroke fallback)
enigo = "0.2"

# Async traits for the PresentationController abstraction
async-trait = "0.1"

# WebSocket client for ProPresenter 7.0–7.8 fallback driver
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

# OpenLP optional Basic Auth header
base64 = "0.22"

# Setlist importers (OpenLyrics, OpenSong, ChordPro, .pptx, .pdf)
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.8"

# mDNS auto-discovery of ProPresenter on the LAN
mdns-sd = "0.13"

# MCP integration
rmcp = { version = "0.1", features = ["client", "transport-sse", "transport-child-process"], optional = true }

[features]
default = []
mcp = ["rmcp"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
