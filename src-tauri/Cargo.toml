[package]
name = "voxxa"
version = "0.1.0"
description = "Voice-following slide advancer for church worship, running entirely on-device"
authors = ["nategroks"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[lib]
name = "voxxa_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "voxxa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Floors at the post-f177fbe versions (ADR-010 A2) so a lock regeneration
# can never fall back below the advisory fixes.
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Audio capture
cpal = "0.15"

# Voice Activity Detection — Silero VAD via ONNX Runtime.
# `voice_activity_detector` bundles the Silero model and handles ORT loading.
voice_activity_detector = "0.2"

# Whisper transcription
whisper-rs = "0.13"

# Model downloads, Planning Center, Hymnary, presenter REST drivers.
# rustls instead of the default native-tls, so OpenSSL is not linked into the app (it remains only as a build-dependency of ort-sys).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "charset", "http2", "system-proxy", "stream", "json"] }
futures-util = "0.3"
dirs = "6"

# Presenter control (keystroke fallback)
enigo = "0.2"

# Async traits for the PresentationController abstraction
async-trait = "0.1"

# WebSocket client for ProPresenter 7.0–7.8 fallback driver
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

# Local HTTP API for hardware integrations (Stream Deck, foot pedals, etc).
# 127.0.0.1-only, opt-in. axum is built on the hyper/tower we already pull in
# via reqwest, so the dep cost is tiny.
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }

# OpenLP optional Basic Auth header
base64 = "0.22"
# The local HTTP API's generated bearer token (already in the tree via ring/rand).
getrandom = "0.3"

# Setlist importers (OpenLyrics, OpenSong, ChordPro, .pptx, .pdf, EW6 SQLite)
# Versions are the smallest that clear RustSec advisories (cargo deny):
# quick-xml 0.41 (RUSTSEC-2026-0194/0195), zip 9 (RUSTSEC-2026-0367/0368/0369/0429),
# pdf-extract 0.12 -> lopdf 0.42 (RUSTSEC-2026-0187),
# rusqlite 0.41 -> libsqlite3-sys 0.39 (RUSTSEC-2026-0459).
# `bundled` compiles SQLite (public domain) into the binary: the EasyWorship
# importer then reads with a known SQLite on every OS, including Windows,
# which ships no system libsqlite3.
quick-xml = "0.41"
zip = { version = "9", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"

# mDNS auto-discovery of ProPresenter on the LAN
mdns-sd = "0.13"

[features]
default = []

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
