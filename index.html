<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxxa</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1 class="logo">Voxxa</h1>
        <span class="status-badge" id="status-badge">Ready</span>
      </header>

      <!-- Main recording area -->
      <section class="recording-section">
        <button class="record-btn" id="record-btn" aria-label="Toggle recording">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <p class="record-hint" id="record-hint">Press <kbd>Ctrl+Shift+Space</kbd> or click to record</p>
        <div class="waveform" id="waveform" hidden>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
      </section>

      <!-- Transcription output -->
      <section class="transcription-section">
        <h2>Transcription</h2>
        <div class="transcription-output" id="transcription-output">
          <p class="placeholder">Transcribed text will appear here...</p>
        </div>
      </section>

      <!-- Navigation tabs -->
      <nav class="tabs">
        <button class="tab active" data-tab="home">Home</button>
        <button class="tab" data-tab="models">Models</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>

      <!-- Models panel -->
      <section class="panel" id="panel-models" hidden>
        <h2>Whisper Models</h2>
        <p class="panel-desc">Download a model to enable transcription. Larger models are more accurate but slower.</p>
        <div class="model-list" id="model-list"></div>
      </section>

      <!-- Settings panel -->
      <section class="panel" id="panel-settings" hidden>
        <h2>Settings</h2>
        <div class="setting-group">
          <label for="select-device">Audio Device</label>
          <select id="select-device"><option value="">Default</option></select>
        </div>
        <div class="setting-group">
          <label for="select-model">Whisper Model</label>
          <select id="select-model"></select>
        </div>
        <div class="setting-group">
          <label for="select-language">Language</label>
          <select id="select-language">
            <option value="">Auto-detect</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="ko">Korean</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="input-hotkey">Hotkey</label>
          <input type="text" id="input-hotkey" value="CmdOrCtrl+Shift+Space" readonly />
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-vad" checked />
            Voice Activity Detection
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-overlay" checked />
            Show Overlay
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-autopaste" checked />
            Auto-paste after recording
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
