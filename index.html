<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxxa</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <h1 class="logo">Voxxa</h1>
        <span class="status-badge ready" id="status-badge">Ready</span>
      </header>

      <!-- Navigation tabs -->
      <nav class="tabs">
        <button class="tab active" data-tab="home">Slides</button>
        <button class="tab" data-tab="models">Models</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>

      <!-- Home: Slide Control -->
      <section class="slide-section" id="section-home">
        <!-- Setlist loader -->
        <div class="setlist-loader" id="setlist-loader">
          <p class="helper-text">Load a setlist to get started</p>
          <label class="file-btn" for="file-input">
            Choose setlist.json
            <input type="file" id="file-input" accept=".json" hidden />
          </label>
          <p class="helper-sub">or drag &amp; drop a JSON file here</p>
        </div>

        <!-- Active slide view (hidden until setlist loaded) -->
        <div class="slide-view" id="slide-view" hidden>
          <div class="song-title" id="song-title"></div>

          <!-- Current slide display -->
          <div class="slide-card current" id="current-slide">
            <div class="slide-label">Current Slide</div>
            <div class="slide-text" id="current-slide-text">—</div>
          </div>

          <!-- Next slide preview -->
          <div class="slide-card next" id="next-slide">
            <div class="slide-label">Next Slide</div>
            <div class="slide-text" id="next-slide-text">—</div>
          </div>

          <!-- Progress -->
          <div class="slide-progress">
            <span id="slide-counter">0 / 0</span>
            <div class="progress-bar">
              <div class="fill" id="slide-progress-fill" style="width: 0%"></div>
            </div>
          </div>

          <!-- Heard text -->
          <div class="heard-section">
            <div class="heard-label">Hearing:</div>
            <div class="heard-text" id="heard-text">Waiting for audio...</div>
          </div>

          <!-- Controls -->
          <div class="controls">
            <button class="ctrl-btn" id="prev-btn" title="Previous slide">&#9664;</button>
            <button class="listen-btn" id="listen-btn">
              <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
              <span id="listen-label">Start Listening</span>
            </button>
            <button class="ctrl-btn" id="next-btn" title="Next slide">&#9654;</button>
          </div>
        </div>
      </section>

      <!-- Models panel -->
      <section class="panel" id="section-models" hidden>
        <h2>Whisper Models</h2>
        <p class="panel-desc">Download a model to enable speech recognition. Larger models are more accurate but slower.</p>
        <div class="model-list" id="model-list"></div>
      </section>

      <!-- Settings panel -->
      <section class="panel" id="section-settings" hidden>
        <h2>Settings</h2>
        <div class="setting-group">
          <label for="select-device">Audio Device</label>
          <select id="select-device"><option value="">Default</option></select>
        </div>
        <div class="setting-group">
          <label for="select-model">Whisper Model</label>
          <select id="select-model"></select>
        </div>
        <div class="setting-group">
          <label for="input-threshold">Similarity Threshold</label>
          <input type="range" id="input-threshold" min="40" max="95" value="70" />
          <span id="threshold-val">70%</span>
        </div>
        <div class="setting-group">
          <label for="input-margin">Advance Margin</label>
          <input type="range" id="input-margin" min="0" max="30" value="10" />
          <span id="margin-val">10</span>
        </div>
        <div class="setting-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggle-vad" checked />
            Voice Activity Detection
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
